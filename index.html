<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YBW UII Leadership Academy - Dashboard MC & Event Interactive System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            uii: {
              navy: '#050E1A',
              card: '#07111E',
              gold: '#F5B800',
              goldHover: '#d9a300',
              goldLight: 'rgba(245, 184, 0, 0.15)',
              border: '#1a2738'
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050E1A;
      color: #f3f4f6;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Montserrat', sans-serif;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #050E1A; }
    ::-webkit-scrollbar-thumb { background: #1a2738; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #F5B800; }
  </style>
</head>
<body class="bg-uii-navy text-gray-100 min-h-screen flex flex-col selection:bg-uii-gold selection:text-uii-navy">

  <!-- HEADER -->
  <header class="bg-uii-card border-b border-uii-border sticky top-0 z-40 px-4 py-3 shadow-xl">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <div class="flex items-center space-x-4">
        <div style="width: 65px; height: 55px; border-radius: 12px;" class="bg-uii-gold flex flex-col items-center justify-center shadow-lg shadow-yellow-500/10 flex-shrink-0">
          <span class="text-uii-navy font-extrabold text-sm leading-tight tracking-wider">YBW</span>
          <span class="text-uii-navy font-black text-xs leading-none">UII</span>
        </div>
        <div>
          <h1 class="text-lg md:text-xl font-extrabold text-white tracking-tight flex items-center gap-2">
            YBW UII Leadership Academy
            <span id="firebaseStatus" class="inline-block w-2.5 h-2.5 rounded-full bg-red-500" title="Koneksi Database"></span>
          </h1>
          <p class="text-xs text-uii-gold font-medium italic">“ Memperkokoh Fondasi, Meluaskan Kontribusi ”</p>
        </div>
      </div>

      <div class="flex items-center gap-4 flex-wrap">
        <div class="hidden sm:flex items-center gap-4 text-xs bg-uii-navy px-3 py-2 rounded-lg border border-uii-border">
          <div><span class="text-gray-400">Total Peserta:</span><span id="statTotalPeserta" class="font-bold text-white ml-1">0</span></div>
          <div class="h-4 w-px bg-uii-border"></div>
          <div><span class="text-gray-400">Partisipan:</span><span id="statPartisipan" class="font-bold text-uii-gold ml-1">0</span></div>
          <div class="h-4 w-px bg-uii-border"></div>
          <div class="text-gray-300 font-mono" id="realtimeClock">00:00:00 WIB</div>
        </div>

        <button onclick="openQRModal()" class="admin-only p-2 bg-uii-navy hover:bg-uii-border text-uii-gold rounded-lg border border-uii-border transition cursor-pointer z-10 hidden" title="Tampilkan QR Code Akses Peserta">
          <i class="fa-solid fa-qrcode text-lg"></i>
        </button>

        <div class="bg-uii-navy p-1 rounded-xl border border-uii-border flex items-center z-10">
          <button id="btnModeAdmin" onclick="setMode('admin')" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all duration-200
